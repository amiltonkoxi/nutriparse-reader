name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: System packages (OCR, PDF rendering, fonts for the benchmark)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hun tesseract-ocr-pol poppler-utils fonts-dejavu-core
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check nutriparse tests ../evaluation
      - name: Tests
        working-directory: backend
        run: pytest -q
      - name: Benchmark (digital, 60 documents)
        run: |
          python evaluation/synth/generate.py --out data/ci --n 60 --seed 2 --scan-share 0
          python evaluation/evaluate.py synth --data data/ci --out ci-results --workers 2
      - name: Safety gate (no allergen present in the product may be reported as absent)
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("ci-results/metrics.json"))["systems"]["v1"]["all"]
          print(f"accuracy={m['accuracy']} unsafe_miss_rate={m['unsafe_miss_rate']}")
          if m["unsafe_miss_rate"] != 0:
              sys.exit("unsafe miss rate must be 0")
          if m["accuracy"] < 0.97:
              sys.exit("digital accuracy dropped below 97%")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: ci-results/REPORT.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
