services:
  - type: web
    name: nutriparse-reader-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://nutriparsereader.vercel.app,http://localhost:3000
      - key: NUTRIPARSE_MAX_UPLOAD_MB
        value: "15"
      - key: NUTRIPARSE_MAX_PAGES
        value: "30"
