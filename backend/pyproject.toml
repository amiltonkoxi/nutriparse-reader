[project]
name = "nutriparse"
dynamic = ["version"]
description = "Evidence-first extraction of the 14 EU allergens and nutrition facts from food specification PDFs"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.dynamic]
version = { attr = "nutriparse.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B008"]  # B008: FastAPI's File(...) default is the documented idiom

[tool.ruff.lint.per-file-ignores]
"nutriparse/nutrition.py" = ["E501", "B007"]  # v0.3 parser kept as is; covered by the benchmark
"../evaluation/synth/vocab.py" = ["E501"]
"../evaluation/baselines/*" = ["E501", "B007", "UP"]
